    <style>
      /* Critical first-paint colors (same values as --bg-main in the app
         stylesheet) so the canvas is already correct before that CSS loads. */
      html { background-color: #FFFFFF; color-scheme: light; }
      html.dark { background-color: #0C0C0C; color-scheme: dark; }
    </style>
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      (function() {
        try {
          if (localStorage.getItem('theme_user_override')) {
            localStorage.removeItem('theme_user_override');
          }
          var manual = localStorage.getItem('user_manual_theme');
          // Manual user toggle on public site always has highest priority
          if (manual === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (manual === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            // Live server-injected state from admin settings (guarantees zero flash)
            var serverRendered = document.documentElement.getAttribute('data-theme-injected');
            if (serverRendered === 'dark') {
              document.documentElement.classList.add('dark');
              try { localStorage.setItem('site_default_theme', 'dark'); } catch(e) {}
            } else if (serverRendered === 'light') {
              document.documentElement.classList.remove('dark');
              try { localStorage.setItem('site_default_theme', 'light'); } catch(e) {}
            } else {
              // Client fallback if rendered statically without injection:
              // a server-set cookie (kept for the session even in private
              // windows) wins over the longer-lived local cache.
              var cookieTheme = null;
              try {
                var themeCookieMatch = document.cookie.match(/(?:^|;\s*)site_default_theme=(light|dark)/);
                if (themeCookieMatch) cookieTheme = themeCookieMatch[1];
              } catch(e) {}
              var siteDefault = cookieTheme || localStorage.getItem('site_default_theme');
              if (siteDefault === 'dark') {
                document.documentElement.classList.add('dark');
              } else if (siteDefault === 'light') {
                document.documentElement.classList.remove('dark');
              }
            }
          }
          // Synchronously cache server-injected view count setting to guarantee zero flash
          var showViewsAttr = document.documentElement.getAttribute('data-show-views-injected');
          if (showViewsAttr === 'true') {
            try { localStorage.setItem('site_show_views', 'true'); } catch(e) {}
          } else if (showViewsAttr === 'false') {
            try { localStorage.setItem('site_show_views', 'false'); } catch(e) {}
          }
        } catch(e) {}
      })();
    </script>
